name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout 120s -v ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/coverage.out
            **/*.test
          retention-days: 7

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build goose binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o goose ./cmd/goose

      - name: Verify binary size
        run: |
          SIZE=$(stat -c%s goose)
          echo "Binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          if [ $SIZE -gt 52428800 ]; then
            echo "::warning::Binary is larger than 50MB"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-binary
          path: goose
          retention-days: 7

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: goose:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect goose:latest --format='{{.Size}}')
          echo "Docker image size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          if [ $SIZE -gt 52428800 ]; then
            echo "::warning::Docker image is larger than 50MB"
          fi

      - name: Test Docker image runs
        run: |
          # Verify the binary exists in the distroless image
          # (distroless has no shell, so we can't use /bin/sh)
          # Copy the binary out and check it
          docker create --name goose-test goose:latest
          docker cp goose-test:/goose /tmp/goose-test
          docker rm goose-test
          ls -lh /tmp/goose-test
          echo "✓ Binary exists in Docker image"

  helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint ./helm

      - name: Template Helm chart
        run: |
          helm template test ./helm \
            --set env.SOURCE_KAFKA_BROKERS=kafka:9092 \
            --set env.SOURCE_KAFKA_TOPIC=events \
            --set env.SINK_HTTP_SERVICE_URL=http://service:8080/api

      - name: Validate K8s manifests (render only)
        run: |
          helm template test ./helm \
            --set env.SOURCE_KAFKA_BROKERS=kafka:9092 \
            --set env.SOURCE_KAFKA_TOPIC=events \
            --set env.SINK_HTTP_SERVICE_URL=http://service:8080/api \
            > /tmp/rendered-manifests.yaml
          echo "Rendered manifests:"
          wc -l /tmp/rendered-manifests.yaml
          grep "^kind:" /tmp/rendered-manifests.yaml | sort | uniq -c
          echo "✓ Helm chart renders valid YAML with expected resources"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: -severity medium -exclude-dir=test ./...

      - name: Run Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  sbom-scan:
    name: SBOM & Container Scan
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: goose:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM
        run: |
          syft goose:latest -o spdx-json --file sbom.spdx.json
          echo "SBOM generated:"
          ls -lh sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

      - name: Run Trivy container scan (report only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: goose:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

      - name: Run Trivy filesystem scan (report only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
        if: always()

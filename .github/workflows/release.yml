name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go test -race -count=1 -timeout 120s ./...

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/goose-kafka/goose
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM
        run: |
          syft ghcr.io/goose-kafka/goose:${{ steps.meta.outputs.version }} -o spdx-json --file goose-sbom.spdx.json
          echo "SBOM generated:"
          ls -lh goose-sbom.spdx.json

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: goose-sbom.spdx.json
        if: always()

      - name: Run Trivy container scan (report only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/goose-kafka/goose:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
        if: always()

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        if: always()

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        if: always()

      - name: Sign Docker image (keyless)
        run: |
          cosign sign --yes ghcr.io/goose-kafka/goose:${{ steps.meta.outputs.version }}
          cosign sign --yes ghcr.io/goose-kafka/goose:latest
        env:
          COSIGN_EXPERIMENTAL: 1

  helm:
    name: Package & Release Helm Chart
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          helm package ./helm --destination ./helm-package
          CHART_NAME=$(ls ./helm-package/*.tgz)
          echo "Packaged: $CHART_NAME"

      - name: Upload Helm chart to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./helm-package/*.tgz
          generate_release_notes: true

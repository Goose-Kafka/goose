image:
  repository: ghcr.io/goose-kafka/goose
  tag: 1.1.0
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  SOURCE_KAFKA_BROKERS: kafka:9092
  SOURCE_KAFKA_TOPIC: events
  SOURCE_KAFKA_CONSUMER_GROUP_ID: goose
  SINK_HTTP_SERVICE_URL: http://order-service:8080/events
  INPUT_SCHEMA_DATA_TYPE: json
  SINK_WORKER_POOL_SIZE: "10"
  SOURCE_KAFKA_CONSUMER_CONFIG_MAX_POLL_RECORDS: "100"

  SINK_HTTP_ERROR_RETRY_STATUS_CODES: "500-599,429,408"
  SINK_HTTP_ERROR_DLQ_STATUS_CODES: "400-428,430-499,500-599"
  SINK_HTTP_DLQ_ENABLED: "true"
  SINK_HTTP_DLQ_KAFKA_TOPIC: goose-dlq
  SINK_HTTP_DLQ_KAFKA_BROKERS: kafka:9092

  METRICS_PROMETHEUS_ENABLED: "true"
  METRICS_PROMETHEUS_PORT: "9090"

  OTEL_TRACING_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: goose

metrics:
  serviceMonitor:
    enabled: true
    interval: 15s

resources:
  requests:
    cpu: 200m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Security context — defaults match the distroless nonroot image (UID 65532)
securityContext: {}

# Network policy — restrict ingress/egress to only required services
networkPolicy:
  enabled: false
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  egressKafkaPorts:
    - 9092
    - 9093
  # egressHTTP:   # add IPs/CIDRs for HTTP sink if needed
  #   - ipBlock:
  #       cidr: 10.0.0.0/8
  # egressOTLP:   # add IPs/CIDRs for OTel collector if needed
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: otel-collector

# PodDisruptionBudget — ensures minimum availability during node drains
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1  # alternatively, use maxUnavailable instead of minAvailable

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80  # optional, uncomment to enable

# Optional: override the security context for the pod
# podSecurityContext:
#   fsGroup: 65532
#   seccompProfile:
#     type: RuntimeDefault

nodeSelector: {}
affinity: {}
tolerations: []
